<!DOCTYPE html>
<html>
<head>
    <title>MW: MURDERWARE - SYSTEM.EXE IS COMPROMISED</title>
    <style>
        body {
            background-color: #000;
            color: #0F0;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            cursor: crosshair;
        }
        #game-canvas {
            border: 2px solid #060;
            box-shadow: 0 0 10px #0F0;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0FF;
            font-size: 14px;
            white-space: pre-wrap;
            pointer-events: none;
            text-shadow: 0 0 5px #0FF;
            z-index: 10;
            font-family: 'Courier New', monospace;
        }
        #menu {
            position: absolute;
            background-color: #000;
            padding: 20px;
            border: 2px solid #0F0;
            box-shadow: 0 0 15px #0F0;
            color: #0F0;
            white-space: pre;
            font-size: 16px;
            z-index: 20;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>
<div id="menu"></div>

<audio id="audio-music-combat" src="audio/keepers_of_the_gate.mp3" loop></audio>
<audio id="audio-sfx-shot" src="audio/blip_shot.wav"></audio>
<audio id="audio-sfx-error" src="audio/beep_damage.wav"></audio>
<audio id="audio-sfx-parry" src="audio/parry.wav"></audio>

<script>
/* =========================================================
   === MW: MURDERWARE COMPLETO / BULLET HELL + JUICY ===
   ========================================================= */

const VIEWPORT_WIDTH = 80, VIEWPORT_HEIGHT = 25;
const MAP_WIDTH = 150, MAP_HEIGHT = 50;
const CHAR_WIDTH = 9, CHAR_HEIGHT = 16;
const CANVAS_WIDTH = VIEWPORT_WIDTH*CHAR_WIDTH;
const CANVAS_HEIGHT = VIEWPORT_HEIGHT*CHAR_HEIGHT;
const FPS = 60, FRAME_TIME = 1000/FPS;
let gameRunning = false;

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
ctx.font = `${CHAR_HEIGHT}px 'Courier New', monospace`;
ctx.textAlign = 'left'; ctx.textBaseline = 'top';

const CHARS = {
    PLAYER:'@', AIM:'>', ENEMY_ERROR:'E', ENEMY_GUN:'G', ENEMY_SMG:'M',
    DATA_CLUSTER:'[D]', WALL:'#', BULLET:'.', GORE:',', BACKGROUND:'/', EMPTY:' '
};
const VHS_COLORS=['#F00','#0FF','#FF0','#F0F','#0F0','#FFF'];
const SCRAMBLE_CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]\\|{};:\'",.<>/?~`';

let mouse={x:0,y:0}, aimAngle=0, keyPressed={}, bullets=[], entities=[], goreParticles=[], backgroundMap=[];
let scrambleArea=[], scrambleCharPool=[], scrambleFrame=0;
let selectedVirus=null, bulletTimer=0, styleRank='F-';
let camera={x:0,y:0}, screenShake=0;

let player = {
    x: MAP_WIDTH/4, y: MAP_HEIGHT/2,
    hp:20, maxHp:20, speed:6,
    dashCooldown:0, weapon:'PISTOL',
    ammo:20, maxAmmo:20, fireRate:5
};

const VIRUS_CLASSES={
    'CODE_RED':{name:'CODE RED',speed_mod:1.0,ammo_mod:1.5,fireRate_mod:0.8,color:'#F00'},
    'ILOVEYOU':{name:'I LOVE YOU',speed_mod:1.2,ammo_mod:1.0,fireRate_mod:1.0,color:'#FF0'},
    'OFFIZ':{name:'OFFIZ (Idiot)',speed_mod:0.8,ammo_mod:1.0,fireRate_mod:1.2,color:'#F0F'}
};

const PARALLAX_SPEED=0.5, SCRAMBLE_SPEED=5;

/* ================= BYTE SCRAMBLE ================= */
function updateByteScramble(){
    if(Math.random()<0.05){
        const x=Math.floor(Math.random()*MAP_WIDTH);
        const y=Math.floor(Math.random()*5)+1;
        if(!scrambleArea.some(p=>p.x===x&&p.y===y)) scrambleArea.push({x:x,y:y});
    }
    scrambleFrame++;
    if(scrambleFrame>=SCRAMBLE_SPEED){
        scrambleFrame=0;
        scrambleCharPool=scrambleArea.map(p=>({x:p.x,y:p.y,char:SCRAMBLE_CHARS[Math.floor(Math.random()*SCRAMBLE_CHARS.length)],color:VHS_COLORS[Math.floor(Math.random()*VHS_COLORS.length)]}));
    }
}

/* =================== ENTIDADES / BULLET HELL =================== */
function updateEntities(){
    bullets=bullets.filter(b=>{
        b.x+=b.dx; b.y+=b.dy;
        if(b.x<=0||b.x>=MAP_WIDTH-1||b.y<=0||b.y>=MAP_HEIGHT-1) return false;
        let hitEnemy=false;
        for(let i=entities.length-1;i>=0;i--){
            const e=entities[i];
            const dist=Math.hypot(b.x-e.x,b.y-e.y);
            if(dist<1){
                e.hp-=1; hitEnemy=true;
                if(e.hp<=0){
                    for(let j=0;j<5;j++){
                        const angle=Math.random()*2*Math.PI;
                        goreParticles.push({x:e.x,y:e.y,dx:Math.cos(angle)*0.5,dy:Math.sin(angle)*0.5,lifetime:30});
                    }
                    // Drop ammo si melee o gun
                    if(e.weapon) player.ammo=Math.min(player.maxAmmo,player.ammo+2);
                    entities.splice(i,1);
                }
                break;
            }
        }
        return !hitEnemy;
    });

    // mover enemigos
    entities.forEach(e=>{
        if(e.type===CHARS.ENEMY_ERROR){ // melee
            const angle=Math.atan2(player.y-e.y,player.x-e.x);
            e.x+=e.speed*Math.cos(angle)/FPS; e.y+=e.speed*Math.sin(angle)/FPS;
        } else { // ranged
            e.fireCooldown=e.fireCooldown||0;
            if(e.fireCooldown<=0){
                const angle=Math.atan2(player.y-e.y,player.x-e.x);
                let spread=0;
                if(e.type===CHARS.ENEMY_SMG) spread=0.2;
                bullets.push({x:e.x,y:e.y,dx:Math.cos(angle+spread),dy:Math.sin(angle+spread),type:CHARS.BULLET,color:'#F00'});
                e.fireCooldown=e.fireRate;
            } else e.fireCooldown--;
        }
    });

    // gore particles
    goreParticles=goreParticles.filter(g=>{
        g.x+=g.dx/FPS; g.y+=g.dy/FPS; g.lifetime--; return g.lifetime>0;
    });
}

/* =================== FIRE PLAYER =================== */
function fireWeapon(){
    if(player.ammo>0 && bulletTimer<=0){
        player.ammo--; bulletTimer=player.fireRate;
        const speed=3; const dx=speed*Math.cos(aimAngle), dy=speed*Math.sin(aimAngle);
        bullets.push({x:player.x,y:player.y,dx:dx,dy:dy,type:CHARS.BULLET,color:selectedVirus.color});
        playSFX('shot');
    }
}

/* =================== DRAW =================== */
function drawCharacter(x,y,char,color='#0F0'){
    const screenX=(x-camera.x)*CHAR_WIDTH;
    const screenY=(y-camera.y)*CHAR_HEIGHT;
    if(screenX>=-CHAR_WIDTH && screenX<CANVAS_WIDTH && screenY>=-CHAR_HEIGHT && screenY<CANVAS_HEIGHT){
        ctx.fillStyle=color; ctx.fillText(char,screenX,screenY);
    }
}

function drawParallaxBackground(){
    const parallaxCameraX=camera.x*PARALLAX_SPEED;
    const parallaxCameraY=camera.y*PARALLAX_SPEED;
    const startX=Math.floor(parallaxCameraX);
    const startY=Math.floor(parallaxCameraY);
    const endX=Math.min(MAP_WIDTH,startX+VIEWPORT_WIDTH+1);
    const endY=Math.min(MAP_HEIGHT,startY+VIEWPORT_HEIGHT+1);
    for(let y=startY;y<endY;y++){
        for(let x=startX;x<endX;x++){
            const char=backgroundMap[y]?.[x];
            if(char && char!==CHARS.EMPTY){
                const screenX=(x-parallaxCameraX)*CHAR_WIDTH;
                const screenY=(y-parallaxCameraY)*CHAR_HEIGHT;
                ctx.fillStyle='#111'; ctx.fillText(char,screenX,screenY);
            }
        }
    }
}

function drawByteScramble(){
    scrambleCharPool.forEach(p=>{
        drawCharacter(p.x,p.y,p.char,p.color);
        const dist=Math.hypot(player.x-p.x,player.y-p.y);
        if(dist<1 && player.hp>0){ player.hp-=0.05/FPS; playSFX('error'); applyScreenShake(2);}
    });
}

/* =================== CAMERA LAG =================== */
function lerp(a,b,t){return a+(b-a)*t;}
function updateCamera(){
    const halfW=VIEWPORT_WIDTH/2, halfH=VIEWPORT_HEIGHT/2;
    let targetX=player.x-halfW, targetY=player.y-halfH;
    const cameraLag=0.1; // Ajustable
    camera.x=lerp(camera.x,targetX,cameraLag);
    camera.y=lerp(camera.y,targetY,cameraLag);
    camera.x=Math.max(0,Math.min(MAP_WIDTH-VIEWPORT_WIDTH,camera.x));
    camera.y=Math.max(0,Math.min(MAP_HEIGHT-VIEWPORT_HEIGHT,camera.y));
}

/* =================== GAME LOOP =================== */
function gameLoop(){
    if(!gameRunning) return;
