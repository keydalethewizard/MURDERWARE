<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MW: MURDERWARE - SYSTEM.EXE IS COMPROMISED</title>
<style>
  body {
    background-color: #000;
    color: #0F0;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    margin:0;
    overflow:hidden;
    cursor: crosshair;
  }
  #game-canvas {
    border:2px solid #060;
    box-shadow: 0 0 10px #0F0;
    display:block;
    margin:0 auto;
    background-color: #000;
  }
  #hud {
    position:absolute;
    top:10px;
    left:10px;
    color:#0FF;
    font-size:14px;
    white-space:pre-wrap;
    pointer-events:none;
    text-shadow:0 0 5px #0FF;
    font-family: 'Courier New', monospace;
    z-index:10;
  }
  #menu {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background-color:#000;
    padding:20px;
    border:2px solid #0F0;
    box-shadow:0 0 15px #0F0;
    color:#0F0;
    white-space:pre;
    font-size:16px;
    font-family: 'Courier New', monospace;
    z-index:20;
  }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>
<div id="menu"></div>

<!-- Audios -->
<audio id="audio-music-combat" src="audio/keepers_of_the_gate.mp3" loop></audio>
<audio id="audio-sfx-shot" src="audio/blip_shot.wav"></audio>
<audio id="audio-sfx-error" src="audio/beep_damage.wav"></audio>
<audio id="audio-sfx-parry" src="audio/parry.wav"></audio>
<audio id="audio-sfx-break" src="audio/break.wav"></audio>

<script>
/* ===========================================
   1. CONFIGURACIÓN INICIAL
=========================================== */
const VIEWPORT_WIDTH = 80;
const VIEWPORT_HEIGHT = 25;
const MAP_WIDTH = 150;
const MAP_HEIGHT = 50;
const CHAR_WIDTH = 9;
const CHAR_HEIGHT = 16;
const CANVAS_WIDTH = VIEWPORT_WIDTH * CHAR_WIDTH;
const CANVAS_HEIGHT = VIEWPORT_HEIGHT * CHAR_HEIGHT;
const FPS = 60;
const FRAME_TIME = 1000/FPS;

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;
ctx.font = `${CHAR_HEIGHT}px 'Courier New', monospace`;
ctx.textAlign = 'left';
ctx.textBaseline = 'top';

let gameRunning = false;
let selectedVirus = null;
let mouse = {x:0, y:0};
let keyPressed = {};
let bullets=[],entities=[],goreParticles=[],targets=[],scrambleArea=[],scrambleCharPool=[];
let bulletTimer=0,scrambleFrame=0,camera={x:0,y:0};
const PARALLAX_SPEED=0.5;
const SCRAMBLE_SPEED=5;
const VHS_COLORS=['#F00','#0FF','#FF0','#F0F','#0F0','#FFF'];
const SCRAMBLE_CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]\\|{};:\'",.<>/?~`';
const CHARS={
  PLAYER:'@',AIM:'>',ENEMY_ERROR:'E',DATA_CLUSTER:'[D]',WALL:'#',BULLET:'.',
  GORE:',',MELEE:'M',CADAVER:'%',BACKGROUND:'/',EMPTY:' '
};

/* ===========================================
   2. VIRUS CLASES
=========================================== */
const VIRUS_CLASSES={
  'CODE_RED':{name:'CODE RED',speed_mod:1.5,ammo_mod:1.5,fireRate_mod:0.8,color:'#F00'},
  'ILOVEYOU':{name:'I LOVE YOU',speed_mod:1.8,ammo_mod:1.2,fireRate_mod:1.0,color:'#FF0'},
  'OFFIZ':{name:'OFFIZ (Idiot)',speed_mod:1.2,ammo_mod:1.0,fireRate_mod:1.2,color:'#F0F'}
};

/* ===========================================
   3. ESTADO DEL JUGADOR
=========================================== */
let player={
  x:MAP_WIDTH/4,
  y:MAP_HEIGHT/2,
  hp:20,
  maxHp:20,
  speed:0,
  maxSpeed:0.5,
  accel:0.05,
  velX:0,
  velY:0,
  dashCooldown:0,
  weapon:'PISTOL',
  ammo:12,
  maxAmmo:12,
  fireRate:8,
  meleeRange:2
};

/* ===========================================
   4. FUNCIONES AUXILIARES
=========================================== */
function drawCharacter(x,y,char,color='#0F0'){
  const screenX = (x-camera.x)*CHAR_WIDTH;
  const screenY = (y-camera.y)*CHAR_HEIGHT;
  if(screenX>=-CHAR_WIDTH && screenX<CANVAS_WIDTH && screenY>=-CHAR_HEIGHT && screenY<CANVAS_HEIGHT){
    ctx.fillStyle=color;
    ctx.fillText(char,screenX,screenY);
  }
}

function drawParallaxBackground(backgroundMap){
  const parallaxCameraX=camera.x*PARALLAX_SPEED;
  const parallaxCameraY=camera.y*PARALLAX_SPEED;
  const startX=Math.floor(parallaxCameraX);
  const startY=Math.floor(parallaxCameraY);
  const endX=Math.min(MAP_WIDTH,startX+VIEWPORT_WIDTH+1);
  const endY=Math.min(MAP_HEIGHT,startY+VIEWPORT_HEIGHT+1);
  for(let y=startY;y<endY;y++){
    for(let x=startX;x<endX;x++){
      const char=backgroundMap[y]?.[x];
      if(char && char!==CHARS.EMPTY){
        const screenX=(x-parallaxCameraX)*CHAR_WIDTH;
        const screenY=(y-parallaxCameraY)*CHAR_HEIGHT;
        ctx.fillStyle='#111';
        ctx.fillText(char,screenX,screenY);
      }
    }
  }
}

/* ===========================================
   5. BYTE SCRAMBLE
=========================================== */
function updateByteScramble(){
  if(Math.random()<0.05){
    const x=Math.floor(Math.random()*MAP_WIDTH);
    const y=Math.floor(Math.random()*5)+1;
    if(!scrambleArea.some(p=>p.x===x && p.y===y)) scrambleArea.push({x:x,y:y});
  }
  scrambleFrame++;
  if(scrambleFrame>=SCRAMBLE_SPEED){
    scrambleFrame=0;
    scrambleCharPool=scrambleArea.map(p=>({x:p.x,y:p.y,char:SCRAMBLE_CHARS[Math.floor(Math.random()*SCRAMBLE_CHARS.length)],color:VHS_COLORS[Math.floor(Math.random()*VHS_COLORS.length)]}));
  }
}

/* ===========================================
   6. ENTIDADES Y BALAS
=========================================== */
function updateEntities(){
  // BALAS
  bullets=bullets.filter(b=>{
    b.x+=b.dx;
    b.y+=b.dy;
    if(b.x<=0||b.x>=MAP_WIDTH-1||b.y<=0||b.y>=MAP_HEIGHT-1) return false;
    let hitEnemy=false;
    for(let i=entities.length-1;i>=0;i--){
      const e=entities[i];
      const dist=Math.hypot(b.x-e.x,b.y-e.y);
      if(dist<1){
        e.hp-=1;
        hitEnemy=true;
        if(e.hp<=0){
          // Cadáver %
          entities[i].dead=true;
          entities[i].char=CHARS.CADAVER;
        }
        break;
      }
    }
    return !hitEnemy;
  });

  // ENEMIGOS
  entities.forEach(e=>{
    if(e.dead) return;
    const angle=Math.atan2(player.y-e.y,player.x-e.x);
    e.x+=e.speed*Math.cos(angle)/FPS;
    e.y+=e.speed*Math.sin(angle)/FPS;
    // Golpe al jugador
    const dist=Math.hypot(player.x-e.x,player.y-e.y);
    if(dist<1 && player.hp>0) player.hp-=0.1/FPS;
  });

  // Partículas de gore
  goreParticles=goreParticles.filter(g=>{
    g.x+=g.dx/FPS;
    g.y+=g.dy/FPS;
    g.lifetime--;
    return g.lifetime>0;
  });
}

/* ===========================================
   7. DISPARO Y MELEE
=========================================== */
function fireWeapon(){
  if(player.ammo>0 && bulletTimer<=0){
    player.ammo--;
    bulletTimer=player.fireRate;
    const dx=Math.cos(player.aimAngle)*1.5;
    const dy=Math.sin(player.aimAngle)*1.5;
    bullets.push({x:player.x,y:player.y,dx:dx,dy:dy,type:CHARS.BULLET,color:VIRUS_CLASSES[selectedVirus].color});
  }
}

function meleeAttack(){
  entities.forEach(e=>{
    const dist=Math.hypot(player.x-e.x,player.y-e.y);
    if(dist<=player.meleeRange && !e.dead){
      e.hp=0;
      e.dead=true;
      e.char=CHARS.CADAVER;
      // Efecto pantalla
      flashScreen();
      // Retroceso enemigos
      bullets=[];
      entities.forEach(en=>{en.x-=en.velX||0; en.y-=en.velY||0;});
    }
  });
}

/* ===========================================
   8. HUD
=========================================== */
function updateHUD(){
  const hpBar='█'.repeat(Math.ceil(player.hp))+'░'.repeat(player.maxHp-Math.ceil(player.hp));
  const ammoBar='█'.repeat(player.ammo)+'░'.repeat(player.maxAmmo-player.ammo);
  const hudText=`
┌───────────────────────────────────────────┐
│ [MW: MURDERWARE] - VIRUS: ${VIRUS_CLASSES[selectedVirus].name}
│                                           │
│  AMMO: [${ammoBar}] ${player.ammo}/${player.maxAmmo}         
│  HP: [${hpBar}]   DASH: [${player.dashCooldown>0?'COOLDOWN':'READY'}]
└───────────────────────────────────────────┘
`;
  document.getElementById('hud').textContent=hudText;
}

/* ===========================================
   9. CÁMARA CON INERCIA
=========================================== */
function updateCamera(){
  const targetX=player.x-VIEWPORT_WIDTH/2;
  const targetY=player.y-VIEWPORT_HEIGHT/2;
  camera.x+=0.1*(targetX-camera.x);
  camera.y+=0.1*(targetY-camera.y);
  camera.x=Math.max(0,Math.min(MAP_WIDTH-VIEWPORT_WIDTH,camera.x));
  camera.y=Math.max(0,Math.min(MAP_HEIGHT-VIEWPORT_HEIGHT,camera.y));
}

/* ===========================================
   10. PANTALLA FLASH
=========================================== */
let flashTimer=0;
function flashScreen(){
  flashTimer=5;
}

/* ===========================================
   11. RENDERIZADO
=========================================== */
function draw(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);
  drawParallaxBackground(backgroundMap);
  bullets.forEach(b=>drawCharacter(b.x,b.y,b.type,b.color));
  entities.forEach(e=>{
    drawCharacter(e.x,e.y,e.dead?CHARS.CADAVER:e.type,e.dead?'#888':'#F00');
  });
  targets.forEach(t=>drawCharacter(t.x,t.y,t.type,t.hp>1?'#FF0':'#F00'));
  drawCharacter(player.x,player.y,CHARS.PLAYER,'#0FF');
  // Arma visible
  const aimDist=1.5;
  const aimX=player.x+aimDist*Math.cos(player.aimAngle);
  const aimY=player.y+aimDist*Math.sin(player.aimAngle);
  drawCharacter(aimX,aimY,CHARS.AIM,'#F0F');
  // Byte scramble
  scrambleCharPool.forEach(p=>{
    drawCharacter(p.x,p.y,p.char,p.color);
    if(Math.hypot(player.x-p.x,player.y-p.y)<1) player.hp-=0.05/FPS;
  });
  // Flash
  if(flashTimer>0){
    ctx.fillStyle='rgba(255,255,255,'+flashTimer/5+')';
    ctx.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);
    flashTimer--;
  }
}

/* ===========================================
   12. INPUT
=========================================== */
function handleInput(){
  let targetVX=0,targetVY=0;
  const maxSpeed=VIRUS_CLASSES[selectedVirus].speed_mod/2;
  if(keyPressed['KeyW']) targetVY-=maxSpeed;
  if(keyPressed['KeyS']) targetVY+=maxSpeed;
  if(keyPressed['KeyA']) targetVX-=maxSpeed;
  if(keyPressed['KeyD']) targetVX+=maxSpeed;
  player.velX+=(targetVX-player.velX)*0.2;
  player.velY+=(targetVY-player.velY)*0.2;
  player.x+=player.velX;
  player.y+=player.velY;
  if(keyPressed['MouseLeft']) fireWeapon();
  if(keyPressed['Space']) meleeAttack();
}

/* ===========================================
   13. GAME LOOP
=========================================== */
function gameLoop(){
  if(!gameRunning) return;
  handleInput();
  player.aimAngle=Math.atan2(mouse.y-(player.y-camera.y)*CHAR_HEIGHT,mouse.x-(player.x-camera.x)*CHAR_WIDTH);
  updateEntities();
  updateByteScramble();
  updateCamera();
  draw();
  updateHUD();
  bulletTimer--;
}

/* ===========================================
   14. INICIALIZACIÓN
=========================================== */
let backgroundMap=[];
function initGame(){
  backgroundMap=Array(MAP_HEIGHT).fill().map(()=>Array(MAP_WIDTH).fill().map(()=>Math.random()<0.2?CHARS.BACKGROUND:CHARS.EMPTY));
  const virus=VIRUS_CLASSES[selectedVirus];
  player.maxSpeed=virus.speed_mod/2;
  player.ammo=Math.round(player.maxAmmo*virus.ammo_mod);
  player.fireRate=Math.round(player.fireRate/virus.fireRate_mod);
  // Generar enemigos
  for(let i=0;i<20;i++){
    entities.push({x:Math.random()*(MAP_WIDTH-10)+5,y:Math.random()*(MAP_HEIGHT-2)+1,type:CHARS.ENEMY_ERROR,hp:3,speed:0.5*virus.speed_mod});
  }
  // Generar targets
  for(let i=0;i<5;i++){
    targets.push({x:Math.random()*(MAP_WIDTH-10)+5,y:Math.random()*(MAP_HEIGHT-2)+1,type:CHARS.DATA_CLUSTER,hp:3});
  }
  document.getElementById('menu').style.display='none';
  gameRunning=true;
  setInterval(gameLoop,FRAME_TIME);
}

/* ===========================================
   15. MENU
=========================================== */
function showMenu(){
  document.getElementById('menu').textContent=`
> EXECUTE MW: MURDERWARE
[SELECT INFECTION TYPE]

  [1] CODE RED  - (AGGRESSIVE SWARM / RÁFAGA)
  [2] ILOVEYOU  - (SOCIAL ENGINEERING / VELOCIDAD)
  [3] OFFIZ
