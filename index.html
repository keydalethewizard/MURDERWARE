<!DOCTYPE html>
<html>
<head>
<title>MW: MURDERWARE - SYSTEM.EXE IS COMPROMISED</title>
<style>
body {background:#000;color:#0F0;font-family:'Courier New', monospace;margin:0;overflow:hidden;cursor:crosshair;}
canvas {display:block;margin:auto;border:2px solid #0F0;box-shadow:0 0 10px #0F0;}
#hud{position:absolute;top:10px;left:10px;color:#0FF;font-family:'Courier New', monospace;white-space:pre;}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>

<script>
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
const CHAR_W=10,CHAR_H=16;
const VIEW_W=80,VIEW_H=25;
const MAP_W=150,MAP_H=50;
canvas.width=VIEW_W*CHAR_W; canvas.height=VIEW_H*CHAR_H;
ctx.font=`${CHAR_H}px Courier New`; ctx.textBaseline='top';

let mouse={x:0,y:0},mouseDown=false,key={};
window.addEventListener('mousemove',e=>{mouse.x=e.clientX; mouse.y=e.clientY;});
window.addEventListener('mousedown',()=>mouseDown=true);
window.addEventListener('mouseup',()=>mouseDown=false);
window.addEventListener('keydown',e=>key[e.code]=true);
window.addEventListener('keyup',e=>key[e.code]=false);

let camera={x:0,y:0};
let bullets=[],enemies=[],gore=[],targets=[],scrambleArea=[],scramblePool=[];
let scrambleFrame=0;
const VHS_COLORS=['#F00','#0FF','#FF0','#F0F','#0F0','#FFF'];
const SCRAMBLE_CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]\\|{};:\'",.<>/?~`';

let player={
x:10,y:10,hp:30,maxHp:30,speed:6,ammo:30,maxAmmo:30,fireRate:3,fireTimer:0,weapon:'PISTOL'
};

const weapons={
'PISTOL':{speed:12,fireRate:5,ammoGain:6},
'SMG':{speed:15,fireRate:2,ammoGain:12},
'SHOTGUN':{speed:10,fireRate:12,ammoGain:8}
};

let currentWeapon='PISTOL';

const VIRUS_CLASSES={
'CODE_RED':{name:'CODE RED',speed_mod:1.0,ammo_mod:1.5,fireRate_mod:0.8,color:'#F00'},
'ILOVEYOU':{name:'I LOVE YOU',speed_mod:1.2,ammo_mod:1.0,fireRate_mod:1.0,color:'#FF0'},
'OFFIZ':{name:'OFFIZ',speed_mod:0.8,ammo_mod:1.0,fireRate_mod:1.2,color:'#F0F'}
};

let selectedVirus='CODE_RED';

function spawnEnemies(){
enemies=[];
for(let i=0;i<15;i++)enemies.push({x:Math.random()*MAP_W,y:Math.random()*MAP_H,hp:5,type:'MELEE',speed:3});
for(let i=0;i<10;i++)enemies.push({x:Math.random()*MAP_W,y:Math.random()*MAP_H,hp:4,type:'GUN',speed:2,shootTimer:Math.floor(Math.random()*30)});
targets=[];
for(let i=0;i<5;i++)targets.push({x:Math.random()*MAP_W,y:Math.random()*MAP_H,hp:3,type:'[D]'});
}

function drawChar(x,y,char,color='#0F0'){
const sx=(x-camera.x)*CHAR_W;
const sy=(y-camera.y)*CHAR_H;
if(sx>=-CHAR_W&&sx<canvas.width&&sy>=-CHAR_H&&sy<canvas.height){ctx.fillStyle=color;ctx.fillText(char,sx,sy);}
}

function updatePlayer(){
let dx=0,dy=0;
if(key['KeyW'])dy-=1;if(key['KeyS'])dy+=1;if(key['KeyA'])dx-=1;if(key['KeyD'])dx+=1;
if(dx!==0||dy!==0){
const mag=Math.hypot(dx,dy);
dx=dx/mag*player.speed/60;dy=dy/mag*player.speed/60;
player.x+=dx;player.y+=dy;
player.x=Math.max(0,Math.min(MAP_W,player.x));
player.y=Math.max(0,Math.min(MAP_H,player.y));
}

// Disparo
if(player.fireTimer>0)player.fireTimer--;
if(mouseDown && player.fireTimer<=0 && player.ammo>0){
const px=player.x,py=player.y,rect=canvas.getBoundingClientRect();
const angle=Math.atan2(mouse.y-(py-camera.y)*CHAR_H-rect.top,mouse.x-(px-camera.x)*CHAR_W-rect.left);
bullets.push({x:px,y:py,dx:Math.cos(angle)*10,dy:Math.sin(angle)*10,color:VIRUS_CLASSES[selectedVirus].color});
player.fireTimer=player.fireRate;
player.ammo--;
}
}

function updateBullets(){
bullets=bullets.filter(b=>{
b.x+=b.dx/60;b.y+=b.dy/60;
if(b.x<0||b.y<0||b.x>MAP_W||b.y>MAP_H)return false;
for(let e of enemies){
if(Math.hypot(b.x-e.x,b.y-e.y)<1){e.hp--;if(e.hp<=0){player.ammo=Math.min(player.maxAmmo,player.ammo+weapons[player.weapon].ammoGain);}}
}
return true;
});
}

function updateEnemies(){
for(let e of enemies){
if(e.type==='MELEE'){
const angle=Math.atan2(player.y-e.y,player.x-e.x);
e.x+=Math.cos(angle)*e.speed/60;e.y+=Math.sin(angle)*e.speed/60;
}else{
e.shootTimer--;
if(e.shootTimer<=0){
const angle=Math.atan2(player.y-e.y,player.x-e.x);
bullets.push({x:e.x,y:e.y,dx:Math.cos(angle)*7,dy:Math.sin(angle)*7,color:'#F00'});
e.shootTimer=Math.floor(Math.random()*60)+30;
}
}
}
// Quitar enemigos muertos
enemies=enemies.filter(e=>e.hp>0);
}

function updateCamera(){
const halfW=VIEW_W/2,halfH=VIEW_H/2;
camera.x+=(player.x-halfW-camera.x)*0.1;
camera.y+=(player.y-halfH-camera.y)*0.1;
}

function updateScramble(){
if(Math.random()<0.05){
const x=Math.floor(Math.random()*MAP_W);
const y=Math.floor(Math.random()*MAP_H);
scrambleArea.push({x:x,y:y});
}
scrambleFrame++;
if(scrambleFrame>=5){scrambleFrame=0;scramblePool=scrambleArea.map(p=>({x:p.x,y:p.y,char:SCRAMBLE_CHARS[Math.floor(Math.random()*SCRAMBLE_CHARS.length)],color:VHS_COLORS[Math.floor(Math.random()*VHS_COLORS.length)]}));}
}

function updateCollisions(){
for(let s of scramblePool){
if(Math.hypot(player.x-s.x,player.y-s.y)<1){player.hp-=0.5/60;}
}
}

function drawGame(){
ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
drawChar(player.x,player.y,'@',VIRUS_CLASSES[selectedVirus].color);
for(let e of enemies)drawChar(e.x,e.y,e.type==='MELEE'?'M':'G','#F00');
for(let b of bullets)drawChar(b.x,b.y,'.',b.color);
for(let t of targets)drawChar(t.x,t.y,t.type,'#FF0');
for(let s of scramblePool)drawChar(s.x,s.y,s.char,s.color);
}

function drawHUD(){
const hpBar='█'.repeat(player.hp)+'░'.repeat(player.maxHp-player.hp);
const ammoBar='█'.repeat(player.ammo)+'░'.repeat(player.maxAmmo-player.ammo);
document.getElementById('hud').textContent=`HP:[${hpBar}]  AMMO:[${ammoBar}]  WEAPON:[${player.weapon}]`;
}

function gameLoop(){
updatePlayer(); updateBullets(); updateEnemies(); updateScramble(); updateCollisions(); updateCamera();
drawGame(); drawHUD();
requestAnimationFrame(gameLoop);
}

spawnEnemies();
gameLoop();
</script>
</body>
</html>
