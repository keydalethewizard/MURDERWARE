<!DOCTYPE html>
<html>
<head>
    <title>MW: MURDERWARE - SYSTEM.EXE IS COMPROMISED</title>
    <style>
        body {
            background-color: #000;
            color: #0F0;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            cursor: crosshair;
        }
        #game-canvas {
            border: 2px solid #060;
            box-shadow: 0 0 10px #0F0;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0FF;
            font-size: 14px;
            white-space: pre-wrap;
            pointer-events: none;
            text-shadow: 0 0 5px #0FF;
            z-index: 10;
            font-family: 'Courier New', monospace;
        }
        #menu {
            position: absolute;
            background-color: #000;
            padding: 20px;
            border: 2px solid #0F0;
            box-shadow: 0 0 15px #0F0;
            color: #0F0;
            white-space: pre;
            font-size: 16px;
            z-index: 20;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <div id="menu"></div>

    <audio id="audio-music-combat" src="audio/keepers_of_the_gate.mp3" loop></audio>
    <audio id="audio-sfx-shot" src="audio/blip_shot.wav"></audio>
    <audio id="audio-sfx-error" src="audio/beep_damage.wav"></audio>
    <audio id="audio-sfx-parry" src="audio/parry.wav"></audio>
    
<script>
const VIEWPORT_WIDTH = 80;
const VIEWPORT_HEIGHT = 25;
const MAP_WIDTH = 150;
const MAP_HEIGHT = 50;
const CHAR_WIDTH = 9;
const CHAR_HEIGHT = 16;
const CANVAS_WIDTH = VIEWPORT_WIDTH * CHAR_WIDTH;
const CANVAS_HEIGHT = VIEWPORT_HEIGHT * CHAR_HEIGHT;
const FPS = 60;
const FRAME_TIME = 1000 / FPS;
let gameRunning = false;

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;
ctx.font = `${CHAR_HEIGHT}px 'Courier New', monospace`;
ctx.textAlign = 'left';
ctx.textBaseline = 'top';

const CHARS = {
    PLAYER: '@',
    AIM: '>',
    ENEMY_ERROR: 'E',
    ENEMY_MELEE: 'M',
    ENEMY_GUN: 'G',
    DATA_CLUSTER: '[D]',
    WALL: '#',
    BULLET: '.',
    GORE: ',',
    BACKGROUND: '/',
    EMPTY: ' '
};
const VHS_COLORS = ['#F00', '#0FF', '#FF0', '#F0F', '#0F0', '#FFF']; 
const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]\\|{};:\'",.<>/?~`';

let mouse = {x:0, y:0}, aimAngle = 0, keyPressed = {}, bullets=[], entities=[], goreParticles=[], targets=[], backgroundMap=[];
let bulletTimer = 0, selectedVirus = null, camera = {x:0, y:0}, scrambleArea=[], scrambleCharPool=[], scrambleFrame=0;
const PARALLAX_SPEED = 0.5;
const SCRAMBLE_SPEED = 5;

let player = {x: MAP_WIDTH/4, y: MAP_HEIGHT/2, hp: 20, maxHp: 20, speed: 2, dashCooldown:0, weapon:'PISTOL', ammo:12, maxAmmo:12, fireRate:5};

const VIRUS_CLASSES = {
    'CODE_RED': {name:'CODE RED', speed_mod:1.0, ammo_mod:1.5, fireRate_mod:0.8, color:'#F00'},
    'ILOVEYOU': {name:'I LOVE YOU', speed_mod:1.2, ammo_mod:1.0, fireRate_mod:1.0, color:'#FF0'},
    'OFFIZ': {name:'OFFIZ', speed_mod:0.8, ammo_mod:1.0, fireRate_mod:1.2, color:'#F0F'}
};

// ------------------- ENTIDADES -------------------
function spawnEntities(){
    entities = [];
    targets = [];
    // enemigos melee
    for(let i=0;i<10;i++){
        entities.push({x:Math.random()*(MAP_WIDTH-10)+5, y:Math.random()*(MAP_HEIGHT-10)+5, type:CHARS.ENEMY_MELEE, hp:5, speed:1.2, melee:true});
    }
    // enemigos a distancia
    for(let i=0;i<10;i++){
        entities.push({x:Math.random()*(MAP_WIDTH-10)+5, y:Math.random()*(MAP_HEIGHT-10)+5, type:CHARS.ENEMY_GUN, hp:3, speed:1.0, melee:false, gunCooldown:Math.floor(Math.random()*60)});
    }
    // Data Clusters
    for(let i=0;i<5;i++){
        targets.push({x:Math.random()*(MAP_WIDTH-10)+5, y:Math.random()*(MAP_HEIGHT-10)+5, type:CHARS.DATA_CLUSTER, hp:3});
    }
}

// ------------------- INPUT -------------------
window.addEventListener('keydown', e=>{if(gameRunning) keyPressed[e.code]=true; if(e.code==='Space') e.preventDefault();});
window.addEventListener('keyup', e=>{if(gameRunning) keyPressed[e.code]=false;});
window.addEventListener('mousemove', e=>{mouse.x=e.clientX; mouse.y=e.clientY;});
window.addEventListener('mousedown', e=>{if(gameRunning&&e.button===0) keyPressed['MouseLeft']=true;});
window.addEventListener('mouseup', e=>{if(gameRunning&&e.button===0) keyPressed['MouseLeft']=false;});

// ------------------- DIBUJO -------------------
function drawCharacter(x,y,char,color='#0F0'){
    const screenX = (x-camera.x)*CHAR_WIDTH;
    const screenY = (y-camera.y)*CHAR_HEIGHT;
    if(screenX>=-CHAR_WIDTH && screenX<CANVAS_WIDTH && screenY>=-CHAR_HEIGHT && screenY<CANVAS_HEIGHT){
        ctx.fillStyle=color;
        ctx.fillText(char, screenX, screenY);
    }
}

function drawParallaxBackground(){
    const parallaxCameraX = camera.x*PARALLAX_SPEED;
    const parallaxCameraY = camera.y*PARALLAX_SPEED;
    const startX=Math.floor(parallaxCameraX);
    const startY=Math.floor(parallaxCameraY);
    const endX=Math.min(MAP_WIDTH,startX+VIEWPORT_WIDTH+1);
    const endY=Math.min(MAP_HEIGHT,startY+VIEWPORT_HEIGHT+1);
    for(let y=startY;y<endY;y++){
        for(let x=startX;x<endX;x++){
            const char=backgroundMap[y]?.[x];
            if(char && char!==CHARS.EMPTY){
                const screenX=(x-parallaxCameraX)*CHAR_WIDTH;
                const screenY=(y-parallaxCameraY)*CHAR_HEIGHT;
                ctx.fillStyle='#111';
                ctx.fillText(char, screenX, screenY);
            }
        }
    }
}

function drawByteScramble(){
    scrambleCharPool.forEach(p=>{
        drawCharacter(p.x,p.y,p.char,p.color);
        const dist=Math.hypot(player.x-p.x,player.y-p.y);
        if(dist<1){player.hp-=0.05/60;playSFX('error');}
    });
}

// ------------------- ENTIDADES -------------------
function updateEntities(){
    // Balas
    bullets = bullets.filter(b=>{
        b.x+=b.dx; b.y+=b.dy;
        if(b.x<0||b.x>=MAP_WIDTH||b.y<0||b.y>=MAP_HEIGHT) return false;
        for(let i=entities.length-1;i>=0;i--){
            const e=entities[i];
            if(Math.hypot(b.x-e.x,b.y-e.y)<1){
                e.hp--;
                if(e.hp<=0){
                    for(let j=0;j<5;j++){
                        const angle=Math.random()*Math.PI*2;
                        goreParticles.push({x:e.x,y:e.y,dx:Math.cos(angle)*0.5,dy:Math.sin(angle)*0.5,lifetime:30});
                    }
                    // loot ammo
                    player.ammo = Math.min(player.maxAmmo, player.ammo+3);
                    entities.splice(i,1);
                }
                return false;
            }
        }
        return true;
    });

    // Mover enemigos
    entities.forEach(e=>{
        const angle=Math.atan2(player.y-e.y,player.x-e.x);
        let speed = e.speed/60;
        e.x += speed*Math.cos(angle);
        e.y += speed*Math.sin(angle);
        // enemigos a distancia disparan
        if(!e.melee){
            e.gunCooldown--;
            if(e.gunCooldown<=0){
                const speedB=1.5;
                bullets.push({x:e.x,y:e.y,dx:speedB*Math.cos(angle),dy:speedB*Math.sin(angle),type:CHARS.BULLET,color:'#FF0'});
                e.gunCooldown = Math.floor(Math.random()*60)+30;
            }
        }
    });

    // Gore
    goreParticles = goreParticles.filter(g=>{
        g.x+=g.dx/60; g.y+=g.dy/60; g.lifetime--;
        return g.lifetime>0;
    });
}

// ------------------- INPUT MOVIMIENTO Y DISPARO -------------------
function handleInput(){
    let dx=0, dy=0;
    const speed=player.speed/60;
    if(keyPressed['KeyW']) dy-=speed;
    if(keyPressed['KeyS']) dy+=speed;
    if(keyPressed['KeyA']) dx-=speed;
    if(keyPressed['KeyD']) dx+=speed;
    if(dx!==0||dy!==0){
        const mag=Math.hypot(dx,dy);
        dx/=mag; dy/=mag;
        dx*=speed; dy*=speed;
    }
    player.x=Math.max(1,Math.min(MAP_WIDTH-2,player.x+dx));
    player.y=Math.max(1,Math.min(MAP_HEIGHT-2,player.y+dy));

    // disparo
    if(keyPressed['MouseLeft'] && bulletTimer<=0){
        bulletTimer = player.fireRate;
        const speedB = 2;
        const dxB = speedB * Math.cos(aimAngle);
        const dyB = speedB * Math.sin(aimAngle);
        bullets.push({x:player.x,y:player.y,dx:dxB,dy:dyB,type:CHARS.BULLET,color:VIRUS_CLASSES[selectedVirus].color});
        player.ammo--;
        playSFX('shot');
    }
    if(bulletTimer>0) bulletTimer--;
}

// ------------------- HUD -------------------
function updateHUD(){
    const hpBar = '█'.repeat(Math.ceil(player.hp)) + '░'.repeat(player.maxHp-Math.ceil(player.hp));
    const ammoBar = '█'.repeat(player.ammo)+'░'.repeat(player.maxAmmo-player.ammo);
    const hudText = `
┌───────────────────────────────┐
│ VIRUS: ${selectedVirus ? VIRUS_CLASSES[selectedVirus].name : 'N/A'}
│ HP: [${hpBar}]  AMMO: [${ammoBar}]
└───────────────────────────────┘
`;
    document.getElementById('hud').textContent = hudText;
}

// ------------------- GAME LOOP -------------------
function gameLoop(){
    if(!gameRunning) return;

    // cámara suave tipo Hotline Miami
    const halfW=VIEWPORT_WIDTH/2, halfH=VIEWPORT_HEIGHT/2;
    camera.x += ((player.x - halfW)-camera.x)*0.1;
    camera.y += ((player.y - halfH)-camera.y)*0.1;

    ctx.fillStyle='#000'; ctx.fillRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);
    drawParallaxBackground();
    updateEntities();
    updateByteScramble();

    // bordes
    for(let i=0;i<MAP_WIDTH;i++){drawCharacter(i,0,CHARS.WALL); drawCharacter(i,MAP_HEIGHT-1,CHARS.WALL);}
    for(let i=1;i<MAP_HEIGHT-1;i++){drawCharacter(0,i,CHARS.WALL); drawCharacter(MAP_WIDTH-1,i,CHARS.WALL);}

    targets.forEach(t=>drawCharacter(t.x,t.y,t.type,'#FF0'));
    entities.forEach(e=>drawCharacter(e.x,e.y,e.type,e.melee?'#F0F':'#F00'));
    bullets.forEach(b=>drawCharacter(b.x,b.y,b.type,b.color));
    goreParticles.forEach(g=>drawCharacter(g.x,g.y,CHARS.GORE,'#F00'));

    // jugador y puntero
    const rect=canvas.getBoundingClientRect();
    const playerPixelX=(player.x-camera.x)*CHAR_WIDTH+rect.left;
    const playerPixelY=(player.y-camera.y)*CHAR_HEIGHT+rect.top;
    aimAngle = Math.atan2(mouse.y-playerPixelY, mouse.x-playerPixelX);
    const aimX=player.x+1.5*Math.cos(aimAngle);
    const aimY=player.y+1.5*Math.sin(aimAngle);
    drawCharacter(aimX,aimY,CHARS.AIM,'#0FF');
    drawCharacter(player.x,player.y,CHARS.PLAYER,'#0FF');

    updateHUD();
}

// ------------------- BYTE SCRAMBLE -------------------
function updateByteScramble(){
    if(Math.random()<0.05){
        const x=Math.floor(Math.random()*MAP_WIDTH);
        const y=Math.floor(Math.random()*5)+1;
        if(!scrambleArea.some(p=>p.x===x&&p.y===y)) scrambleArea.push({x,y});
    }
    scrambleFrame++;
    if(scrambleFrame>=SCRAMBLE_SPEED){
        scrambleFrame=0;
        scrambleCharPool = scrambleArea.map(p=>({
            x:p.x, y:p.y,
            char:SCRAMBLE_CHARS[Math.floor(Math.random()*SCRAMBLE_CHARS.length)],
            color:VHS_COLORS[Math.floor(Math.random()*VHS_COLORS.length)]
        }));
    }
}

// ------------------- AUDIO -------------------
function initAudio(){document.getElementById('audio-music-combat').volume=0.5; document.getElementById('audio-music-combat').play().catch(e=>{});}
function playSFX(name){const audio=document.getElementById('audio-sfx-'+name); if(audio){audio.currentTime=0; audio.volume=name==='error'?0.2:1.0; audio.play().catch(e=>{});}}

// ------------------- MENÚ -------------------
function showMenu(){
    const menuHTML = `
> EXECUTE MW: MURDERWARE
[SELECT INFECTION TYPE]

  [1] CODE RED
  [2] ILOVEYOU
  [3] OFFIZ

> Press 1-3 to start
`;
    document.getElementById('menu').innerHTML=menuHTML;
}

function handleMenuInput(e){
    if(['1','2','3'].includes(e.key)){
        const map = {'1':'CODE_RED','2':'ILOVEYOU','3':'OFFIZ'};
        selectedVirus = map[e.key];
        document.getElementById('menu').style.display='none';
        // ajustar stats del virus
        const virus = VIRUS_CLASSES[selectedVirus];
        player.speed *= virus.speed_mod;
        player.maxAmmo = Math.round(player.maxAmmo*virus.ammo_mod);
        player.ammo = player.maxAmmo;
        player.fireRate = Math.round(player.fireRate/virus.fireRate_mod);
        spawnEntities();
        gameRunning=true;
        initAudio();
        setInterval(gameLoop,FRAME_TIME);
        setInterval(updateByteScramble,FRAME_TIME);
        window.removeEventListener('keydown',handleMenuInput);
    }
}

showMenu();
window.addEventListener('keydown',handleMenuInput);
</script>
</body>
</html>
